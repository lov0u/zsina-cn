name: Build and Push to ACR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: lov0u
  IMAGE_NAME: zsina
  SITE_SLUG: zsina
  PORT: 3005

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{{{env.ACR_REGISTRY}}}}
        username: ${{{{secrets.ACR_USERNAME}}}}
        password: ${{{{secrets.ACR_PASSWORD}}}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{{{env.ACR_REGISTRY}}}}/${{{{env.ACR_NAMESPACE}}}}/${{{{env.IMAGE_NAME}}}}:latest
          ${{{{env.ACR_REGISTRY}}}}/${{{{env.ACR_NAMESPACE}}}}/${{{{env.IMAGE_NAME}}}}:${{{{github.sha}}}}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{{{secrets.SERVER_HOST}}}}
        username: ${{{{secrets.SERVER_USER}}}}
        password: ${{{{secrets.SERVER_PASSWORD}}}}
        script: |
          echo "=== Deploy zsina ==="
          echo "Login ACR..."
          docker login crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com -u ${{{secrets.ACR_USERNAME}}}} -p ${{{secrets.ACR_PASSWORD}}}}
          echo "Pull image..."
          docker pull crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/zsina:latest
          echo "Stop old container..."
          docker stop zsina || true
          docker rm zsina || true
          echo "Start new container..."
          docker run -d \
            --name zsina \
            --restart always \
            -p 3005:3000 \
            -e NODE_ENV=production \
            crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/zsina:latest
          echo "Prune old images..."
          docker image prune -f
          echo "Done!"